name: Docs

# Requires Pages enabled in repo settings (Settings > Pages > Source: GitHub Actions).
on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # Deploy is skipped until you opt in: enable Pages (Settings > Pages >
      # Source: GitHub Actions) AND add an Actions variable ENABLE_PAGES=true.
      # This keeps the run green with no errors until the site is ready to publish.
      - id: deploy
        if: vars.ENABLE_PAGES == 'true'
        uses: actions/deploy-pages@v4
