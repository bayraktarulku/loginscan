name: Publish to PyPI

# Publishes when you push a version tag like v0.1.0.
# Uses PyPI Trusted Publishing (OIDC) - no API token needed once the PyPI
# project is configured to trust this repo/workflow.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
