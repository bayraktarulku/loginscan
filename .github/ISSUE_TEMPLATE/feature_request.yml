name: Feature request
description: Suggest a new check or capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: For a new check, describe what it detects and how (kept low-volume and non-destructive).
    validations:
      required: true
